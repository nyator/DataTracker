name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests
        run: bundle exec fastlane test

      # Catches a mis-pasted secret before signing, naming which one is wrong.
      # Checks what each secret contains; never prints the values.
      - name: Check signing secrets
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          ok=true
          pass() { echo "OK    $1"; }
          fail() { echo "WRONG $1"; ok=false; }
          tmp=$(mktemp -d)

          [ ${#ASC_KEY_ID} -eq 10 ] && pass "ASC_KEY_ID" || fail "ASC_KEY_ID: should be the 10-character Key ID, got ${#ASC_KEY_ID} characters"
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] && pass "ASC_ISSUER_ID" || fail "ASC_ISSUER_ID: should be a 36-character UUID, got ${#ASC_ISSUER_ID} characters"

          printf %s "$ASC_KEY_P8_BASE64" | base64 -D > "$tmp/key.p8" 2>/dev/null
          grep -q "BEGIN PRIVATE KEY" "$tmp/key.p8" && pass "ASC_KEY_P8_BASE64" \
            || fail "ASC_KEY_P8_BASE64: not a base64-encoded .p8 key (got ${#ASC_KEY_P8_BASE64} characters)"

          printf %s "$DIST_CERT_P12_BASE64" | base64 -D > "$tmp/cert.p12" 2>/dev/null
          if [ ! -s "$tmp/cert.p12" ]; then
            fail "DIST_CERT_P12_BASE64: empty or not base64 (got ${#DIST_CERT_P12_BASE64} characters)"
          elif subject=$(openssl pkcs12 -in "$tmp/cert.p12" -passin env:DIST_CERT_PASSWORD -nokeys 2>/dev/null \
                         || openssl pkcs12 -legacy -in "$tmp/cert.p12" -passin env:DIST_CERT_PASSWORD -nokeys 2>/dev/null); then
            pass "DIST_CERT_PASSWORD opens DIST_CERT_P12_BASE64"
            echo "$subject" | grep -q "Apple Distribution" && pass "Certificate is Apple Distribution" \
              || fail "DIST_CERT_P12_BASE64: certificate is not an Apple Distribution certificate"
          else
            fail "DIST_CERT_PASSWORD doesn't open DIST_CERT_P12_BASE64 (wrong password, or not a .p12)"
          fi

          rm -rf "$tmp"
          $ok || { echo "::error::One or more signing secrets are wrong. Re-set the ones marked WRONG."; exit 1; }

      # Uploads only from main (push or manual run), never from pull requests.
      - name: Build, sign and upload to TestFlight
        if: github.event_name != 'pull_request'
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ~/Library/Logs/gym
            fastlane/test_output
          if-no-files-found: ignore
